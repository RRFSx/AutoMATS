  application: "Surface Radiation"
  plot_type: "die off"
  matched_samples: true
  statistic: [rmse, bias]

- name: radiation_valid_time
  application: "Surface Radiation"
  plot_type: "Valid Time"
  matched_samples: true
  statistic: [rmse, bias]
  forecast lead time: [0, 3]

