# Example AutoMATS recipe

experiments:
- name: RRFSv2_conus_3km_ret_v2x_retv4
  color: red
- name: RRFSv2_conus_3km_ret_v2x_retv4p1_3p5km
  color: blue

automation:
  minimum waiting seconds: 6
  control waiting seconds: 0.6

common:
  line weight: 3
  marker weight: 8

plots:
- name: sfc_tseries
  application: "surface"
  truth: "METAR"
  plot_type: "time series"
  region: "All HRRR domain"
  variable: [t2m, td2m, wind10m]
  statistic: [rmse, bias, rmse+bias]
  forecast lead time: [0, 1, 12]

- name: ua_profile
  application: "Upper Air"
  plot_type: profile
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 3, 6, 12]

slides:
- plot group: sfc_tseries
  title: Surface Time Series RMSE f000h
  number of rows: 2
  row1: [t2m_rmse_f000, td2m_rmse_f000]
  row2: [wind10m_rmse_f000]

- plot group: sfc_tseries
  title: Surface Time Series Bias f000h
  number of rows: 2
  row1: [t2m_bias_f000, td2m_bias_f000]
  row2: [wind10m_bias_f000]

- plot group: sfc_tseries
  title: Surface Time Series RMSE f001h
  number of rows: 2
  row1: [t2m_rmse_f001, td2m_rmse_f001]
  row2: [wind10m_rmse_f001]

- plot group: sfc_tseries
  title: Surface Time Series Bias f001h
  number of rows: 2
  row1: [t2m_bias_f001, td2m_bias_f001]
  row2: [wind10m_bias_f001]

- plot group: ua_profile
  title: Upper Air Profile f000, f003
  number of rows: 2
  row1: [T_rmse+bias_f000, RHobT_rmse+bias_f000, Wind_rmse+bias_f000]
  row2: [T_rmse+bias_f003, RHobT_rmse+bias_f003, Wind_rmse+bias_f003]

- plot group: ua_profile
  title: Upper Air Profile f006, f012
  number of rows: 2
  row1: [T_rmse+bias_f006, RHobT_rmse+bias_f006, Wind_rmse+bias_f006]
  row2: [T_rmse+bias_f012, RHobT_rmse+bias_f012, Wind_rmse+bias_f012]
