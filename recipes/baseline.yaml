# baseline recipe to generate MATS verification plots/slides.
#   sfc_dieoff:  t2m, td2m, wind10m, rmse+bias
#   sfc_tseries: t2m, td2m, wind10m, rmse, bias, f000, f001, f012
#   RAOB_dieoff:   T, RHobT, Wind, rmse+bias
#   RAOB_profile:  T, RHobT, Wind, rmse+bias, f000, f001, f003, f006, f009, f012
#   RAOB_tseries:  T, RHobT, Wind, rmse+bias, f001
#   radar_dieoff:      cref, csi+freq, treshold25, threshold35, threshold45
#   ceiling_dieoff:    csi+freq, treshold500, threshold1000, threshold3000, threshold6000
#   visibility_dieoff: csi+freq, treshold1, threshold3, threshold5, threshold10
#   graphics: CREF_full

experiments:
- MATS name: RRFSv2_conus_3km_ret_v2x_retv4
  short name: base4
  color: red
  COMROOT: gaeac6:/gpfs/f6/bil-fire10-oar/world-shared/jjh/rrfsv2/RRFSv2X/L60/OPSROOT/RRFSv2X.retv4/com/rrfs/v2.1.4
- MATS name: RRFSv2_conus_3km_ret_v2x_retv5
  short name: base5
  color: blue
  COMROOT: /gpfs/f6/bil-fire10-oar/world-shared/jjh/rrfsv2/RRFSv2X/L60/OPSROOT/RRFSv2.retv5/com/rrfs/v2.1.4
- MATS name: HRRR_OPS
  short name: HRRR
  color: orange
#- MATS name: RRFS_A
#  short name: RRFSA
#  color: "#5F5F5F"

pygraf graphics slides:
  enable: true
  recipe: graphics_slides_layout2_May2024.yaml

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# detailed recipes
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
common:
  #start and end dates are optional, if not specificed, use the first exp date range
  #start: "2024-05-06T10:00:00Z"
  #end: "2024-05-13T00:00:00Z"
  line weight: 3
  marker weight: 8
  #description font size: 24
  #legend font size: 28

automation:
  inter-plot waiting seconds: 3 
  control waiting seconds: 0.3  # pesudo "mouse click" intervals, 300ms 
  #base_url: "https://gsl.noaa.gov/int-mats"  # When the official MATS is down

# ======================================= plot groups  =============================================
plots:
- name: sfc_dieoff
  application: "Surface (METAR)"
  truth: "METAR"
  plot_type: dieoff
  region: "All HRRR domain"
  variable: [t2m, td2m, wind10m]
  statistic: [rmse+bias]

- name: sfc_tseries
  application: "Surface (METAR)"
  truth: "METAR"
  plot_type: "time series"
  region: "All HRRR domain"
  variable: [t2m, td2m, wind10m]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 12, 24]
  #Difference curves: "Diff all curves against the 1st added curve"

- name: ROAB_dieoff
  application: "Upper Air"
  plot_type: dieoff
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  Valid UTC Hour: [all, 0z, 12z]
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]

- name: ROAB_profile
  application: "Upper Air"
  plot_type: profile
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  Valid UTC Hour: [all, 0z, 12z]
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 3, 6, 12, 24]

- name: ROAB_tseries
  application: "Upper Air"
  plot_type: "time series"
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 3, 6, 12, 24]

- name: AMDAR_dieoff
  application: "Upper Air"
  plot_type: dieoff
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  Valid UTC Hour: [all, 0z, 12z]
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]

- name: AMDAR_profile
  application: "Upper Air"
  plot_type: profile
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  Valid UTC Hour: [all, 0z, 12z]
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 3, 6, 12, 24]

- name: AMDAR_tseries
  application: "Upper Air"
  plot_type: "time series"
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 3, 6, 12, 24]

- name: radar_dieoff
  #exclude experiment: [HRRR_OPS]
  application: "Radar (MRMS)"
  plot_type: "die off"
  region: "Continental US"
  matched_samples: true
  variable: ["Composite Reflectivity"]
  Threshold: [15, 25, 35, 45]
  statistic: [CSI+Bias]
  #Difference curves: "Diff all curves against the 1st added curve"

- name: ceiling_dieoff
  application: "Ceiling and Visibility"
  plot_type: "die off"
  region: "All HRRR domain"
  matched_samples: true
  variable: ["ceiling"]
  Threshold: [500, 1000, 3000, 6000]
  statistic: [CSI+BIAS]
  #Difference curves: "Diff all curves against the 1st added curve"

- name: visibility_dieoff
  application: "Ceiling and Visibility"
  plot_type: "die off"
  region: "All HRRR domain"
  matched_samples: true
  variable: ["visibility"]
  Threshold: [1, 3, 5, 10]
  statistic: [CSI+ BIAS]
  #Difference curves: "Diff all curves against the 1st added curve"


# ======================================= MATS slides  =============================================
slides:
# -----  surface slides ------
- plot group: sfc_dieoff
  title: Surface Dieoff
  number of rows: 2
  row1: [t2m, td2m]
  row2: [wind10m]

- plot group: sfc_tseries
  title: T2M Time Series RMSE+BIAS
  number of rows: 2
  row1: [f000, f001]
  row2: [f012, f024]

- plot group: sfc_tseries
  title: Td2M Time Series RMSE+BIAS
  number of rows: 2
  row1: [f000, f001]
  row2: [f012, f024]

- plot group: sfc_tseries
  title: Wind10m Time Series RMSE+BIAS
  number of rows: 2
  row1: [f000, f001]
  row2: [f012, f024]

# -----  RAOB slides ------
- plot group: RAOB_dieoff
  title: T RAOB Dieoff
  number of rows: 2
  row1: [all]
  row2: [0z, 12z]

- plot group: RAOB_dieoff
  title: RHobT RAOB Dieoff
  number of rows: 2
  row1: [all]
  row2: [0z, 12z]

- plot group: RAOB_dieoff
  title: Wind RAOB Dieoff
  number of rows: 2
  row1: [all]
  row2: [0z, 12z]

- plot group: RAOB_profile
  title: T ROAB Profile f000, f001
  number of rows: 2
  row1: [all_f000, 0z_f000, 12z_f000]
  row2: [all_f001, 0z_f001, 12z_f001]

- plot group: RAOB_profile
  title: RHobT ROAB Profile f000, f001
  number of rows: 2
  row1: [all_f000, 0z_f000, 12z_f000]
  row2: [all_f001, 0z_f001, 12z_f001]

- plot group: RAOB_profile
  title: Wind ROAB Profile f000, f001
  number of rows: 2
  row1: [all_f000, 0z_f000, 12z_f000]
  row2: [all_f001, 0z_f001, 12z_f001]

- plot group: RAOB_tseries
  title: Upper Air Time Series RMSE+Bias f001h
  number of rows: 1
  row1: [T_rmse+bias_f001]

# -----  radar slides ------
- plot group: radar_dieoff
  title: RADAR MRMS Dieoff CSI
  number of rows: 2
  row1: [csi_threshold25, csi_threshold35]
  row2: [csi_threshold45]

- plot group: radar_dieoff
  title: RADAR MRMS Dieoff BIAS
  number of rows: 2
  row1: [bias_threshold25, bias_threshold35]
  row2: [bias_threshold45]


# -----  C&V slides ------
- plot group: ceiling_dieoff
  title: Ceiling Dieoff CSI
  number of rows: 2
  row1: [csi_threshold500, csi_threshold1000]
  row2: [csi_threshold3000, csi_threshold6000]

- plot group: ceiling_dieoff
  title: Ceiling Dieoff BIAS
  number of rows: 2
  row1: [bias_threshold500, bias_threshold1000]
  row2: [bias_threshold3000, bias_threshold6000]

- plot group: visibility_dieoff
  title: Visibility Dieoff CSI
  number of rows: 2
  row1: [csi_threshold1, csi_threshold3]
  row2: [csi_threshold5, csi_threshold10]

- plot group: visibility_dieoff
  title: Visibility Dieoff BIAS
  number of rows: 2
  row1: [bias_threshold1, bias_threshold3]
  row2: [bias_threshold5, bias_threshold10]


