# baseline recipe to generate MATS verification plots/slides.
#   sfc_dieoff:  t2m, td2m, wind10m, rmse+bias
#   sfc_tseries: t2m, td2m, wind10m, rmse, bias, f000, f001, f012
#   ua_dieoff:   T, RHobT, Wind, rmse+bias
#   ua_profile:  T, RHobT, Wind, rmse+bias, f000, f001, f003, f006, f009, f012
#   ua_tseries:  T, RHobT, Wind, rmse+bias, f001
#   radar_dieoff:      cref, csi+freq, treshold25, threshold35, threshold45
#   ceiling_dieoff:    csi+freq, treshold500, threshold1000, threshold3000, threshold6000
#   visibility_dieoff: csi+freq, treshold1, threshold3, threshold5, threshold10
#   graphics: CREF_full

experiments:
- name: RRFSv2_conus_3km_ret_v2x_retv4
  color: red
  #COMROOT: /gpfs/f6/bil-fire10-oar/world-shared/jjh/rrfsv2/RRFSv2X/L60/OPSROOT/RRFSv2X.retv4/com/rrfs/v2.1.4
- name: RRFSv2_conus_3km_ret_v2x_retv4p1_3p5km
  color: blue
  #COMROOT: /gpfs/f6/bil-fire10-oar/world-shared/jjh/rrfsv2/RRFSv2X/L60/OPSROOT/RRFSv2X.retv4/com/rrfs/v2.1.4
- name: HRRR_OPS
  color: orange
#- name: RRFS_A
#  color: "#5F5F5F"

pygraf graphics slides:
  enable: true
  #recipe: mygraphics.yaml  # for specifying a special graphics recipe

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# detailed recipes
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
common:
  #start and end dates are optional, if not specificed, use the first exp date range
  #start: "2024-05-06T10:00:00Z"
  #end: "2024-05-13T00:00:00Z"
  line weight: 3
  marker weight: 8

automation:
  inter-plot waiting seconds: 3 
  control waiting seconds: 0.3  # pesudo "mouse click" intervals, 300ms 
  #base_url: "https://gsl.noaa.gov/int-mats"  # When the official MATS is down

# ======================================= plot groups  =============================================
plots:
- name: sfc_dieoff
  application: "surface"
  truth: "METAR"
  plot_type: dieoff
  region: "All HRRR domain"
  variable: [t2m, td2m, wind10m]
  statistic: [rmse+bias]

- name: sfc_tseries
  application: "surface"
  truth: "METAR"
  plot_type: "time series"
  region: "All HRRR domain"
  variable: [t2m, td2m, wind10m]
  statistic: [rmse, bias]
  forecast lead time: [0, 1, 12]
  #Difference curves: "Diff all curves against the 1st added curve"

- name: ua_dieoff
  application: "Upper Air"
  plot_type: dieoff
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]

- name: ua_profile
  application: "Upper Air"
  plot_type: profile
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 3, 6, 9, 12]

- name: ua_tseries
  application: "Upper Air"
  plot_type: "time series"
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  variable: [T]
  statistic: [rmse+bias]
  forecast lead time: [1]

- name: radar_dieoff
  exclude experiment: [HRRR_OPS]
  application: "Radar (MRMS)"
  plot_type: "die off"
  region: "Continental US"
  matched_samples: true
  variable: ["Composite Reflectivity"]
  Threshold: [25, 35, 45]
  statistic: [CSI, Bias]
  Difference curves: "Diff all curves against the 1st added curve"

- name: ceiling_dieoff
  application: "Ceiling and Visibility"
  plot_type: "die off"
  region: "All HRRR domain"
  matched_samples: true
  variable: ["ceiling"]
  Threshold: [500, 1000, 3000, 6000]
  statistic: [CSI, BIAS]
  Difference curves: "Diff all curves against the 1st added curve"

- name: visibility_dieoff
  application: "Ceiling and Visibility"
  plot_type: "die off"
  region: "All HRRR domain"
  matched_samples: true
  variable: ["visibility"]
  Threshold: [1, 3, 5, 10]
  statistic: [CSI, BIAS]
  Difference curves: "Diff all curves against the 1st added curve"


# ======================================= MATS slides  =============================================
slides:
# -----  surface slides ------
- plot group: sfc_dieoff
  title: Surface Dieoff
  number of rows: 2
  row1: [t2m, td2m]
  row2: [wind10m]

- plot group: sfc_tseries
  title: Surface Time Series RMSE f000h
  number of rows: 2
  row1: [t2m_rmse_f000, td2m_rmse_f000]
  row2: [wind10m_rmse_f000]

- plot group: sfc_tseries
  title: Surface Time Series Bias f000h
  number of rows: 2
  row1: [t2m_bias_f000, td2m_bias_f000]
  row2: [wind10m_bias_f000]

- plot group: sfc_tseries
  title: Surface Time Series RMSE f001h
  number of rows: 2
  row1: [t2m_rmse_f001, td2m_rmse_f001]
  row2: [wind10m_rmse_f001]

- plot group: sfc_tseries
  title: Surface Time Series Bias f001h
  number of rows: 2
  row1: [t2m_bias_f001, td2m_bias_f001]
  row2: [wind10m_bias_f001]

# -----  upper air slides ------
- plot group: ua_dieoff
  title: Upper Air Dieoff
  number of rows: 2
  row1: [T, RHobT]
  row2: [Wind]

- plot group: ua_profile
  title: Upper Air Profile f000, f001
  number of rows: 2
  row1: [T_rmse+bias_f000, RHobT_rmse+bias_f000, Wind_rmse+bias_f000]
  row2: [T_rmse+bias_f001, RHobT_rmse+bias_f001, Wind_rmse+bias_f001]

- plot group: ua_profile
  title: Upper Air Profile f003, f006
  number of rows: 2
  row1: [T_rmse+bias_f003, RHobT_rmse+bias_f003, Wind_rmse+bias_f003]
  row2: [T_rmse+bias_f006, RHobT_rmse+bias_f006, Wind_rmse+bias_f006]

- plot group: ua_profile
  title: Upper Air Profile f009, f012
  number of rows: 2
  row1: [T_rmse+bias_f009, RHobT_rmse+bias_f009, Wind_rmse+bias_f009]
  row2: [T_rmse+bias_f012, RHobT_rmse+bias_f012, Wind_rmse+bias_f012]

- plot group: ua_tseries
  title: Upper Air Time Series RMSE+Bias f001h
  number of rows: 1
  row1: [T_rmse+bias_f001]


# -----  radar slides ------
- plot group: radar_dieoff
  title: RADAR MRMS Dieoff CSI
  number of rows: 2
  row1: [csi_threshold25, csi_threshold35]
  row2: [csi_threshold45]

- plot group: radar_dieoff
  title: RADAR MRMS Dieoff BIAS
  number of rows: 2
  row1: [bias_threshold25, bias_threshold35]
  row2: [bias_threshold45]


# -----  C&V slides ------
- plot group: ceiling_dieoff
  title: Ceiling Dieoff CSI
  number of rows: 2
  row1: [csi_threshold500, csi_threshold1000]
  row2: [csi_threshold3000, csi_threshold6000]

- plot group: ceiling_dieoff
  title: Ceiling Dieoff BIAS
  number of rows: 2
  row1: [bias_threshold500, bias_threshold1000]
  row2: [bias_threshold3000, bias_threshold6000]

- plot group: visibility_dieoff
  title: Visibility Dieoff CSI
  number of rows: 2
  row1: [csi_threshold1, csi_threshold3]
  row2: [csi_threshold5, csi_threshold10]

- plot group: visibility_dieoff
  title: Visibility Dieoff BIAS
  number of rows: 2
  row1: [bias_threshold1, bias_threshold3]
  row2: [bias_threshold5, bias_threshold10]


