[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automats"
version = "0.1.0"
description = "Automatic MATS verification plots"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "playwright>=1.49,<2", "python-pptx>=1.0.2,<2"]

[project.scripts]
automats = "automats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
